version: "3.8"
services:
  redis-server:
    image: redis
    container_name: redis_server
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --loglevel warning
    healthcheck:
      test: /healthchecks/redis.sh
      interval: "5s"
    volumes:
      - "./healthchecks/redis.sh"
      - cache:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf

volumes:
  cache:
    driver: local
